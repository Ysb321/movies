<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yetflix — by Yashraj</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b0f; color: #f5f5f7;
        font-family: "Segoe UI", Arial, sans-serif; display: flex; align-items: center; justify-content: center; }
      .box { text-align: center; padding: 2rem; }
      .logo { font-size: 3rem; font-weight: 900; letter-spacing: 0.02em; color: #e50914; }
      .muted { color: #8b8b95; font-size: 0.9rem; line-height: 1.7; }
      code { background: #1a1a22; padding: 0.15rem 0.45rem; border-radius: 4px; }
      a { color: #e50914; }
    </style>
  </head>
  <body>
    <!-- Shown only if the window URL was left pointing at local resources.
         Normally the app window loads the Yetflix site URL directly. -->
    <div class="box">
      <div class="logo">YETFLIX</div>
      <p class="muted">
        by Yashraj
      </p>
      <p class="muted">
        This window is not connected to a site yet.<br />
        Edit <code>desktop-neutralino/site-url.txt</code> with your Yetflix URL<br />
        (e.g. <code>https://your-site.vercel.app/home</code>), then run <code>npm run build</code>.
      </p>
    </div>
  </body>
</html>
